services:

  mysql:
    image: mysql:8.0
    container_name: employee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Subil...@1
      MYSQL_DATABASE: employee_db

    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - employee-network

  backend:
    build:
      context: ./employee-crud
    container_name: employee-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: employee_db
      DB_USERNAME: root
      DB_PASSWORD: Subil...@1
    depends_on:
      - mysql
    networks:
      - employee-network

  frontend:
    build:
      context: ../employee-frontend
    container_name: employee-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - employee-network

networks:
  employee-network:
    driver: bridge

volumes:
  mysql_data: